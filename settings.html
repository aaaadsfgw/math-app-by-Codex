<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>設定 - Math Study Log AI</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/settings.css"></head><body>
<header class="app-header"><div class="header-inner"><a class="brand" href="popup.html"><span class="brand-mark">∑</span>Math Study Log AI</a><nav class="top-nav" aria-label="主な画面"><a href="history.html">履歴</a><a href="analytics.html">分析</a><a href="review.html">復習</a><a href="geometry.html">図形</a><a aria-current="page" href="settings.html">設定</a><a href="help.html">ヘルプ</a></nav></div></header>
<main class="page-shell stack"><header class="page-heading"><h1>設定</h1><p class="muted">ローカルLLMと学習記録の動作を調整します。</p></header><form id="settingsForm" class="card">
<div class="setting-row"><div><strong>Ollama API URL</strong><div class="field-help">正式対応はlocalhost/127.0.0.1の11434のみです。</div></div><input id="apiUrl" type="url" required></div><div class="setting-row"><label for="modelName"><strong>モデル名</strong></label><input id="modelName" required></div><div class="setting-row"><label for="defaultMode"><strong>既定モード</strong></label><select id="defaultMode"><option value="answer">答え</option><option value="hint1">ヒント1</option><option value="hint2">ヒント2</option><option value="steps">途中式</option><option value="explain">解説</option></select></div><div class="setting-row"><label for="timeoutSeconds"><strong>回答タイムアウト（秒）</strong></label><input id="timeoutSeconds" type="number" min="5" max="300" required></div><div class="setting-row"><label for="maxHistory"><strong>履歴最大件数</strong></label><input id="maxHistory" type="number" min="10" max="5000" required></div>
<div class="setting-row"><strong>履歴保存</strong><label class="toggle"><input id="saveHistory" type="checkbox">回答を学習履歴へ保存する</label></div><div class="setting-row"><strong>デモモード</strong><label class="toggle"><input id="demoMode" type="checkbox">Ollama停止時、固定デモ例だけを使う</label></div><div class="setting-row"><strong>未検証AI回答</strong><label class="toggle"><input id="allowUnverifiedAiAnswer" type="checkbox">ソルバー未対応時のAI回答を表示する</label></div><div class="setting-row"><strong>ショートカット</strong><span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Y</kbd>（macOS: <kbd>Command</kbd> + <kbd>Shift</kbd> + <kbd>Y</kbd>）</span></div>
<div class="button-row"><button class="button primary" type="submit">設定を保存</button><button id="resetSettingsButton" class="button" type="button">設定を初期化</button><button id="clearAllDataButton" class="button danger" type="button">全データを削除</button></div><div id="settingsMessage" role="status" aria-live="polite"></div></form></main><script type="module" src="js/settings.js"></script></body></html>
