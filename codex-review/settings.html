<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>設定 - Math Study Log</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/settings.css"></head><body>
<header class="app-header"><div class="header-inner"><a class="brand" href="popup.html"><span class="brand-mark">∑</span>Math Study Log</a><nav class="top-nav" aria-label="主な画面"><a href="history.html">履歴</a><a href="analytics.html">分析</a><a href="review.html">復習</a><a aria-current="page" href="settings.html">設定</a><a href="help.html">ヘルプ</a></nav></div></header>
<main class="page-shell stack"><header class="page-heading"><h1>設定</h1><p class="muted">オフライン数式エンジンと学習記録の動作を調整します。</p></header><form id="settingsForm" class="card" aria-busy="true">
<div class="setting-row"><label for="learningMode"><strong>利用モード</strong><span id="learningModeHelp" class="setting-description">ポップアップとショートカットで共通して使用します。Quickでは履歴を残しません。</span></label><select id="learningMode" aria-describedby="learningModeHelp"><option value="quick">Quick（履歴に保存しない）</option><option value="study" selected>Study（学習履歴を作る）</option></select></div>
<div class="setting-row"><label for="defaultMode"><strong>ポップアップの既定表示</strong><span id="defaultModeHelp" class="setting-description">Ctrl+Enterで最初に表示する内容です。</span></label><select id="defaultMode" aria-describedby="defaultModeHelp"><option value="answer">答え</option><option value="hint1">Hint 1</option><option value="hint2">Hint 2</option><option value="steps">途中式</option><option value="explain">解説</option></select></div>
<div class="setting-row"><label for="shortcutAction"><strong>ショートカットの既定アクション</strong><span id="shortcutActionHelp" class="setting-description">選択文またはクリップボードの問題に対して返す内容です。</span></label><select id="shortcutAction" aria-describedby="shortcutActionHelp"><option value="answer">Answer</option><option value="hint1">Hint 1</option><option value="hint2">Hint 2</option><option value="steps">Steps</option></select></div>
<div class="setting-row"><label for="maxHistory"><strong>履歴最大件数</strong><span id="maxHistoryHelp" class="setting-description">Study Modeで保存する履歴の上限です（10〜5000件）。</span></label><input id="maxHistory" type="number" min="10" max="5000" value="500" aria-describedby="maxHistoryHelp" required></div>
<div class="setting-row"><strong>Study Modeの履歴保存</strong><label class="toggle"><input id="saveHistory" type="checkbox" checked>回答と閲覧した段階を学習履歴へ保存する</label></div><div class="setting-row"><strong>処理方式</strong><span>通信なし・解答生成AIなしのオフライン数式エンジン</span></div><div class="setting-row"><strong>ショートカット</strong><span><kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Y</kbd>（macOS: <kbd>Command</kbd> + <kbd>Shift</kbd> + <kbd>Y</kbd>）</span></div>
<section class="ocr-settings" aria-labelledby="ocrSettingsHeading">
<div><h2 id="ocrSettingsHeading">画像OCR</h2><p class="setting-description">画像認識は数式文字列の候補を作るだけです。認識結果は解析前に確認・修正する必要があり、数学的な検証済み表示とは別です。</p></div>
<dl class="settings-definition-list"><div><dt>現在の状態</dt><dd id="ocrAvailabilityInfo">確認中</dd></div><div><dt>候補バックエンド</dt><dd id="ocrBackendInfo">確認中</dd></div><div><dt>候補モデル</dt><dd id="ocrModelInfo">確認中</dd></div><div><dt>実行方式</dt><dd id="ocrProviderInfo">確認中</dd></div></dl>
<p class="field-help"><a href="docs/ocr-candidate-evaluation.md" target="_blank" rel="noopener">OCR候補比較・ライセンス確認状況を開く</a></p>
</section>
<div class="button-row"><button class="button primary" type="submit">設定を保存</button><button id="resetSettingsButton" class="button" type="button">設定を初期化</button><button id="clearAllDataButton" class="button danger" type="button">全データを削除</button></div><div id="settingsMessage" role="status" aria-live="polite"></div></form></main><script type="module" src="js/settings.js"></script></body></html>
