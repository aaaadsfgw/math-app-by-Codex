<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>履歴 - Math Study Log</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/history.css"></head><body>
<header class="app-header"><div class="header-inner"><a class="brand" href="popup.html"><span class="brand-mark">∑</span>Math Study Log</a><nav class="top-nav" aria-label="主な画面"><a aria-current="page" href="history.html">履歴</a><a href="analytics.html">分析</a><a href="review.html">復習</a><a href="settings.html">設定</a><a href="help.html">ヘルプ</a></nav></div></header>
<main class="page-shell stack"><header class="page-heading"><h1>学習履歴</h1><p class="muted">回答・検証状態・自己評価を後から見直せます。</p></header>
<section class="card stack"><div class="toolbar"><div class="field"><label for="sortSelect">並べ替え</label><select id="sortSelect"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="score">低スコア順</option></select></div><div class="field"><label for="categoryFilter">分野</label><select id="categoryFilter"><option value="">すべて</option></select></div><div class="field"><label for="modeFilter">モード</label><select id="modeFilter"><option value="">すべて</option><option value="answer">答え</option><option value="hint1">ヒント1</option><option value="hint2">ヒント2</option><option value="steps">途中式</option><option value="explain">解説</option></select></div><label class="toggle"><input id="reviewOnly" type="checkbox">要復習のみ</label></div>
<div class="button-row"><button id="exportButton" class="button" type="button">履歴JSONを書き出す</button><button id="importButton" class="button" type="button">履歴JSONを読み込む</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="clearHistoryButton" class="button danger" type="button">履歴をすべて削除</button></div><p class="field-help">設定は入出力しません。読み込んだ「検証済み」表示は安全のため未検証へ戻します。</p><div id="historyMessage" role="status" aria-live="polite"></div></section>
<section id="historyList" class="record-list" aria-live="polite"></section><div id="historyEmpty" class="empty-state" hidden>条件に一致する履歴はありません。</div></main><script type="module" src="js/history.js"></script></body></html>
