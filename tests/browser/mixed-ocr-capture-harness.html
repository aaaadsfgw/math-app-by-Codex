<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mixed Japanese and formula OCR harness</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #eef3f9; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { padding: 20px; background: #fff; text-align: center; }
    #ocrCaptureTarget {
      box-sizing: border-box;
      width: 900px;
      height: 400px;
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      background: #fff;
      color: #000;
    }
    .instruction { font: 48px/1.25 "Yu Gothic UI", Meiryo, sans-serif; }
    .formula { width: 290px; height: 120px; margin: auto auto 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Mixed OCR capture harness</h1>
    <div
      id="ocrCaptureTarget"
      data-natural-width="145"
      data-natural-height="60"
      data-capture-width="900"
      data-capture-height="400"
      data-expected-kind="mixed"
      data-expected-question-label="(1)"
      data-expected-instruction="次の方程式を解け"
    >
      <div class="instruction">(1) 次の方程式を解け</div>
      <img
        class="formula"
        src="../../vendor/ocr/ibem-im2typst/smoke-formula.png"
        width="290"
        height="120"
        alt="x plus y"
      >
    </div>
  </main>
</body>
</html>
