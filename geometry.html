<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>図形エディタ - Math Study Log AI</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/geometry.css"></head><body>
<header class="app-header"><div class="header-inner"><a class="brand" href="popup.html"><span class="brand-mark">∑</span>Math Study Log AI</a><nav class="top-nav" aria-label="主な画面"><a href="history.html">履歴</a><a href="analytics.html">分析</a><a href="review.html">復習</a><a aria-current="page" href="geometry.html">図形</a><a href="settings.html">設定</a><a href="help.html">ヘルプ</a></nav></div></header>
<main class="page-shell stack"><header class="page-heading spread"><div><h1>図形エディタ</h1><p class="muted">見た目ではなく、入力した数学条件を使って計算します。</p></div><span id="geometrySupportBadge" class="badge success">三角形は計算対応</span></header>
<section class="card toolbar"><div class="field"><label for="templateSelect">テンプレート</label><select id="templateSelect"><option value="triangle">一般三角形</option><option value="right-triangle">直角三角形</option><option value="isosceles-triangle">二等辺三角形</option><option value="equilateral-triangle">正三角形</option><option value="circle">円</option><option value="circle-tangent">円と接線</option><option value="parallel-transversal">平行線と横切る線</option><option value="quadrilateral">四角形</option><option value="coordinate-plane">座標平面</option></select></div><button id="addSegmentButton" class="button" type="button" aria-pressed="false">線分を追加</button><label class="toggle"><input id="auxiliaryToggle" type="checkbox">補助線として追加</label><button id="resetGeometryButton" class="button danger" type="button">初期状態へ戻す</button></section>
<div class="geometry-workspace"><section class="card stack"><div id="canvasInstruction" class="notice" role="status">点をドラッグできます。辺または点をクリックすると条件を入力できます。</div><div class="canvas-wrap"><svg id="geometryCanvas" viewBox="0 0 400 330" role="img" aria-label="図形編集キャンバス"></svg></div></section>
<aside class="stack"><section class="card stack"><h2>条件を追加</h2><div class="field"><label for="constraintType">条件の種類</label><select id="constraintType"><option value="length">辺の長さ</option><option value="angle">角度</option><option value="height">高さ</option><option value="perpendicular">垂直</option><option value="equal-length">等しい辺</option><option value="equal-angle">等しい角</option><option value="parallel">平行（UIのみ）</option><option value="midpoint">中点（UIのみ）</option><option value="tangent">接線（UIのみ）</option><option value="on-circle">円周上（UIのみ）</option><option value="radius">半径（UIのみ）</option><option value="diameter">直径（UIのみ）</option></select></div><div class="field"><label for="constraintTarget">対象</label><input id="constraintTarget" placeholder="例: AB、A、AB,AC"></div><div class="field"><label for="constraintValue">値</label><input id="constraintValue" type="number" step="any" placeholder="長さ・角度・高さだけ入力"></div><button id="addConstraintButton" class="button" type="button">条件を追加</button><ul id="constraintList" class="constraint-list"></ul></section>
<section class="card stack"><h2>求める対象</h2><div class="field"><label for="querySelect">対象</label><select id="querySelect"><option value="area">面積</option><option value="perimeter">周長</option><option value="side-AB">辺AB</option><option value="side-BC">辺BC</option><option value="side-CA">辺CA</option><option value="angle-A">角A</option><option value="angle-B">角B</option><option value="angle-C">角C</option><option value="height">高さ</option></select></div><div class="button-row"><button id="calculateGeometryButton" class="button primary" type="button">計算する</button><button id="saveGeometryButton" class="button" type="button">下書き保存</button><button id="saveGeometryHistoryButton" class="button" type="button" disabled>結果を履歴保存</button></div><div id="geometryMessage" role="status" aria-live="polite"></div><div id="geometryResult" class="result-output" hidden></div></section></aside></div></main><script type="module" src="js/geometry-editor.js"></script></body></html>
